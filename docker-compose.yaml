version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI
      - CLIENT_SECRET
      - CAS_URL
    user: "1001"
    volumes:
      - ./:/app
    command: ["node", "/app/packages/server/dist/server.js"]
